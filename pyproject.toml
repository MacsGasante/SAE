[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sae"
version = "0.1.0-alpha1"
description = "SuperEnalotto Analytics Engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

authors = [
    { name = "SAE Project" }
]

keywords = [
    "superenalotto",
    "analytics",
    "statistics",
    "research",
    "python"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed"
]

[project.urls]
Homepage = "https://github.com/<username>/SAE"
Repository = "https://github.com/<username>/SAE"
Issues = "https://github.com/<username>/SAE/issues"

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.coverage.run]
source = ["src/sae"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff.lint.per-file-ignores]
"src/sae/kernel/foundation/base.py" = ["B024"]
